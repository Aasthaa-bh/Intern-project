<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSewa - Sign In</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .main-container {
            display: flex;
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 2px 30px rgba(0,0,0,0.15);
        }
        .left-panel {
            flex: 1;
            background: #f9f9f9;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 1px solid #e0e0e0;
        }
        .merchant-logo {
            width: 60px;
            height: 60px;
            background: #60bb46;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .merchant-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 30px;
        }
        .payment-details {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
        }
        .payment-details h3 {
            font-size: 16px;
            color: #666;
            margin-bottom: 15px;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .detail-row:last-child {
            border-bottom: none;
            padding-top: 15px;
            margin-top: 10px;
            border-top: 2px solid #e0e0e0;
        }
        .detail-label {
            color: #666;
            font-size: 14px;
        }
        .detail-value {
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        .detail-row:last-child .detail-value {
            color: #60bb46;
            font-size: 20px;
        }
        .right-panel {
            flex: 1;
            padding: 40px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background: #60bb46;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
            margin-right: 10px;
        }
        .logo-text {
            font-size: 32px;
            font-weight: 600;
            color: #333;
        }
        .signin-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
        }
        .form-container {
            margin-top: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: flex;
            align-items: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .form-group label svg {
            margin-right: 8px;
            color: #999;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }
        .form-group input:focus {
            outline: none;
            border-color: #60bb46;
        }
        .password-field {
            position: relative;
        }
        .password-field input {
            padding-right: 45px;
        }
        .eye-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
        }
        .recaptcha {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #f9f9f9;
            display: flex;
            align-items: center;
        }
        .recaptcha input {
            margin-right: 10px;
        }
        .recaptcha-text {
            font-size: 12px;
            color: #666;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #60bb46;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            text-transform: uppercase;
        }
        .btn-login:hover {
            background: #4fa838;
        }
        .forgot-link {
            text-align: center;
            margin-top: 15px;
        }
        .forgot-link a {
            color: #60bb46;
            text-decoration: none;
            font-size: 14px;
        }
        .register-section {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        .register-section p {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .register-section a {
            color: #60bb46;
            text-decoration: none;
            font-weight: 600;
        }
        .cancel-btn {
            text-align: center;
            margin-top: 20px;
        }
        .cancel-btn button {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 14px;
            text-transform: uppercase;
            padding: 10px 20px;
        }
        .cancel-btn button:hover {
            color: #666;
        }
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .left-panel {
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Left Panel - Merchant Info -->
        <div class="left-panel">
            <div class="merchant-logo">e</div>
            <div class="merchant-name">EPAYTEST</div>
            
            <div class="payment-details">
                <h3>Total Amount</h3>
                <div class="detail-row">
                    <span class="detail-label">Total Amount</span>
                    <span class="detail-value">{{ invoice.total_amount }}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">NPR.</span>
                    <span class="detail-value">{{ invoice.total_amount }}</span>
                </div>
            </div>
        </div>

        <!-- Right Panel - Login Form -->
        <div class="right-panel">
            <div class="header">
                <div class="logo">
                    <div class="logo-icon">e</div>
                    <div class="logo-text">Sewa</div>
                </div>
                <h2 class="signin-title">Sign in to your account</h2>
            </div>

            <form method="POST" action="{% url 'esewa_mock_process' invoice.id %}" class="form-container">
                {% csrf_token %}
                
                <div class="form-group">
                    <label>
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/>
                        </svg>
                        eSewa ID
                    </label>
                    <input type="text" name="esewa_id" placeholder="eSewa ID" required>
                </div>

                <div class="form-group">
                    <label>
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
                        </svg>
                        Password/MPIN
                    </label>
                    <div class="password-field">
                        <input type="password" name="mpin" id="mpin" placeholder="Password/MPIN" required>
                        <span class="eye-icon" onclick="togglePassword()">
                            <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
                                <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                                <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
                            </svg>
                        </span>
                    </div>
                </div>

                <div class="recaptcha">
                    <input type="checkbox" id="recaptcha" checked>
                    <label for="recaptcha" class="recaptcha-text">
                        I'm not a robot<br>
                        <small style="color: #999;">reCAPTCHA • Privacy - Terms</small>
                    </label>
                </div>

                <button type="submit" class="btn-login">Login</button>

                <div class="forgot-link">
                    <a href="#">Forgot Password?</a>
                </div>
            </form>

            <div class="register-section">
                <p>Don't have an account? <a href="#">Register</a></p>
            </div>

            <div class="cancel-btn">
                <form method="POST" action="{% url 'esewa_mock_cancel' invoice.id %}">
                    {% csrf_token %}
                    <button type="submit">Cancel Payment</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const mpinField = document.getElementById('mpin');
            if (mpinField.type === 'password') {
                mpinField.type = 'text';
            } else {
                mpinField.type = 'password';
            }
        }
    </script>
</body>
</html>
