<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Table Status - FlexiPOS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #c44569 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .form-card {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #c44569;
            font-size: 28px;
            margin-bottom: 10px;
            text-align: center;
        }
        .table-info {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 18px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-weight: 600;
            font-size: 16px;
        }
        select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.3s;
        }
        select:focus {
            outline: none;
            border-color: #ff6b6b;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff6b6b 0%, #c44569 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(196, 69, 105, 0.4);
        }
        .btn-secondary {
            background: #95a5a6;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-secondary:hover {
            background: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="form-card">
        <h1>🍽️ Update Table Status</h1>
        <div class="table-info">Table {{ table.table_number }}</div>
        
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="status">Select New Status</label>
                <select name="status" id="status" required>
                    <option value="AVAILABLE" {% if table.status == 'AVAILABLE' %}selected{% endif %}>✅ Available</option>
                    <option value="OCCUPIED" {% if table.status == 'OCCUPIED' %}selected{% endif %}>🔴 Occupied</option>
                    <option value="RESERVED" {% if table.status == 'RESERVED' %}selected{% endif %}>🟡 Reserved</option>
                </select>
            </div>
            
            <div class="btn-group">
                <a href="{% url 'table_check' %}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Update Status</button>
            </div>
        </form>
    </div>
</body>
</html>
