{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">

  <div class="w-full max-w-md">

    <div class="bg-white border border-slate-200 shadow-sm rounded-2xl p-8">

      <!-- Header -->
      <div class="text-center mb-6">
        <h2 class="text-2xl font-semibold text-slate-900">
          Change Your Password
        </h2>
        <p class="text-sm text-slate-600 mt-2">
          For security reasons, please update your password on first login.
        </p>
      </div>

      <!-- Messages -->
      {% if messages %}
        <div class="mb-4 space-y-2">
          {% for message in messages %}
            <div
              class="rounded-lg border p-3 text-sm
              {% if message.tags == 'success' %}
                border-emerald-200 bg-emerald-50 text-emerald-800
              {% elif message.tags == 'error' %}
                border-rose-200 bg-rose-50 text-rose-800
              {% else %}
                border-slate-200 bg-slate-50 text-slate-700
              {% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}

      <!-- Form -->
      <form method="POST" class="space-y-5">
        {% csrf_token %}

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">
            New Password
          </label>
          <input
            type="password"
            name="new_password"
            required
            class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900 transition"
            placeholder="Enter new password"
          >
        </div>

        <!-- Buttons -->
        <div class="flex flex-col gap-3">

          <button
            type="submit"
            class="w-full bg-slate-900 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-slate-800 transition">
            Update Password
          </button>

          <!-- Back to Login -->
          <a href="{% url 'login' %}"
             class="w-full text-center border border-slate-300 py-2.5 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100 transition">
             ← Back to Login
          </a>

        </div>

      </form>

    </div>

  </div>

</body>
</html>
