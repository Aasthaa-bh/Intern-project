{% extends "owner/base.html" %}

{% block content %}

<h1 class="text-3xl font-bold mb-8">Dashboard</h1>

<div class="grid grid-cols-3 gap-6">

    <div class="bg-white p-6 rounded shadow">
        <h2 class="text-2xl font-bold">{{ total_staff }}</h2>
        <p class="text-gray-500">Total Staff</p>
    </div>

    <div class="bg-white p-6 rounded shadow">
        <h2 class="text-2xl font-bold">{{ total_categories }}</h2>
        <p class="text-gray-500">Menu Categories</p>
    </div>

    <div class="bg-white p-6 rounded shadow">
        <h2 class="text-2xl font-bold">{{ total_items }}</h2>
        <p class="text-gray-500">Menu Items</p>
    </div>

    <div class="bg-white p-6 rounded shadow">
        <h2 class="text-2xl font-bold">{{ total_tables }}</h2>
        <p class="text-gray-500">Total Tables</p>
    </div>

</div>

{% endblock %}
