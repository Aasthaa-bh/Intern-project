{% load static %}
<div class="p-6 border-b border-slate-800">
    <h2 class="text-xl font-black text-white tracking-tight leading-none mb-1">FlexiPOS</h2>
    <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Waiter Panel</p>
</div>

<div class="flex-1 overflow-y-auto py-4">

    <nav class="space-y-1 px-3">
        <a href="{% url 'waiter_dashboard' %}"
           class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-colors group
                  {% if request.resolver_match.url_name == 'waiter_dashboard' %}bg-indigo-600/10 text-indigo-400 font-bold{% else %}hover:bg-slate-800 hover:text-white text-slate-300{% endif %}">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
            </svg>
            Dashboard
        </a>

        <a href="{% url 'waiter_tables' %}"
           class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-colors group
                  {% if request.resolver_match.url_name == 'waiter_tables' %}bg-indigo-600/10 text-indigo-400 font-bold{% else %}hover:bg-slate-800 hover:text-white text-slate-300{% endif %}">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M3 14h18M10 4v16M14 4v16"/>
            </svg>
            Tables
        </a>

        <a href="{% url 'waiter_done_orders' %}"
           class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-colors group relative
                  {% if request.resolver_match.url_name == 'waiter_done_orders' %}bg-indigo-600/10 text-indigo-400 font-bold{% else %}hover:bg-slate-800 hover:text-white text-slate-300{% endif %}">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
            Done Orders
            {% if ready_orders_count > 0 %}
            <span class="absolute right-4 bg-rose-500 text-white text-[10px] font-black w-5 h-5 flex items-center justify-center rounded-full animate-pulse">{{ ready_orders_count }}</span>
            {% endif %}
        </a>
    </nav>

    <div class="px-6 mt-8 mb-2 text-[10px] font-bold text-slate-500 uppercase tracking-widest">
        Create Order
    </div>

    <nav class="space-y-1 px-3">
        <a href="{% url 'create_order_by_type' 'DINE_IN' %}"
           class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white text-slate-300 font-medium transition-colors group">
            <svg class="w-5 h-5 flex-shrink-0 text-slate-500 group-hover:text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 15.546c-.523 0-1.046.151-1.5.454a2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.701 2.701 0 00-1.5-.454M9 6v2m3-2v2m3-2v2M9 3h.01M12 3h.01M15 3h.01M21 21v-7a2 2 0 00-2-2H5a2 2 0 00-2 2v7h18zm-3-9v-2a2 2 0 00-2-2H8a2 2 0 00-2 2v2h12z"/>
            </svg>
            Dine In
        </a>

        <a href="{% url 'create_order_by_type' 'TAKEAWAY' %}"
           class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white text-slate-300 font-medium transition-colors group">
            <svg class="w-5 h-5 flex-shrink-0 text-slate-500 group-hover:text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
            </svg>
            Takeaway
        </a>

        <a href="{% url 'create_order_by_type' 'DELIVERY' %}"
           class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white text-slate-300 font-medium transition-colors group">
            <svg class="w-5 h-5 flex-shrink-0 text-slate-500 group-hover:text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
            Delivery
        </a>
    </nav>

</div>
