{% extends 'base.html' %}

{% block content %}

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem;">
  
  <div style="background:white; border-radius:16px; padding:2rem; width:100%; max-width:520px; box-shadow:0 8px 32px rgba(0,0,0,0.15);">
    
    <!-- Header -->
    <div style="margin-bottom:1.5rem;">
      <h2 style="margin:0 0 4px; font-size:22px; font-weight:600; color:#1a1a2e;">Add New Item</h2>
      <p style="margin:0; font-size:14px; color:#888;">Fill in the details to add a product to your POS</p>
    </div>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <!-- Product Name -->
      <div style="margin-bottom:1rem;">
        <label style="display:block; font-size:13px; font-weight:500; color:#444; margin-bottom:6px;">Product Name</label>
        <input 
          type="text" 
          name="name" 
          placeholder="e.g. Espresso"
          required
          style="width:100%; padding:10px 14px; border:1.5px solid #e0e0e0; border-radius:10px; font-size:14px; outline:none; box-sizing:border-box; transition:border-color .2s;"
          onfocus="this.style.borderColor='#6c63ff'" 
          onblur="this.style.borderColor='#e0e0e0'"
        />
      </div>

      <!-- Price -->
      <div style="margin-bottom:1rem;">
        <label style="display:block; font-size:13px; font-weight:500; color:#444; margin-bottom:6px;">Price (Rs.)</label>
        <input 
          type="number" 
          name="price" 
          step="0.01"
          placeholder="0.00"
          required
          style="width:100%; padding:10px 14px; border:1.5px solid #e0e0e0; border-radius:10px; font-size:14px; outline:none; box-sizing:border-box; transition:border-color .2s;"
          onfocus="this.style.borderColor='#6c63ff'" 
          onblur="this.style.borderColor='#e0e0e0'"
        />
      </div>

      <!-- Item Type -->
      <div style="margin-bottom:1rem;">
        <label style="display:block; font-size:13px; font-weight:500; color:#444; margin-bottom:6px;">Item Type</label>
        <select 
          name="item_type"
          required
          style="width:100%; padding:10px 14px; border:1.5px solid #e0e0e0; border-radius:10px; font-size:14px; outline:none; box-sizing:border-box; background:white; color:#444; cursor:pointer; appearance:auto;"
          onfocus="this.style.borderColor='#6c63ff'" 
          onblur="this.style.borderColor='#e0e0e0'"
        >
          <option value="">-- Select Type --</option>
          <option value="MENU">Menu</option>
          <option value="PRODUCT">Product</option>
          <option value="SERVICE">Service</option>
        </select>
      </div>

      <!-- Category -->
      <div style="margin-bottom:1rem;">
        <label style="display:block; font-size:13px; font-weight:500; color:#444; margin-bottom:6px;">Category</label>
        <select 
          name="category"
          style="width:100%; padding:10px 14px; border:1.5px solid #e0e0e0; border-radius:10px; font-size:14px; outline:none; box-sizing:border-box; background:white; color:#444; cursor:pointer; appearance:auto;"
          onfocus="this.style.borderColor='#6c63ff'" 
          onblur="this.style.borderColor='#e0e0e0'"
        >
          <option value="">-- Select Category --</option>
          {% for category in categories %}
            <option value="{{ category.id }}">{{ category.name }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Description -->
      <div style="margin-bottom:1rem;">
        <label style="display:block; font-size:13px; font-weight:500; color:#444; margin-bottom:6px;">Description <span style="color:#aaa; font-weight:400;">(optional)</span></label>
        <textarea 
          name="description" 
          placeholder="Brief description of the item..."
          rows="3"
          style="width:100%; padding:10px 14px; border:1.5px solid #e0e0e0; border-radius:10px; font-size:14px; outline:none; box-sizing:border-box; resize:vertical; font-family:inherit; transition:border-color .2s;"
          onfocus="this.style.borderColor='#6c63ff'" 
          onblur="this.style.borderColor='#e0e0e0'"
        ></textarea>
      </div>

      <!-- Image Upload -->
      <div style="margin-bottom:1.5rem;">
        <label style="display:block; font-size:13px; font-weight:500; color:#444; margin-bottom:6px;">Product Image <span style="color:#aaa; font-weight:400;">(optional)</span></label>
        
        <label for="image-input" 
          id="upload-zone"
          style="display:block; border:2px dashed #c5bfff; border-radius:12px; padding:28px 20px; text-align:center; cursor:pointer; background:#f9f8ff; transition:all .2s;"
          onmouseover="this.style.background='#f0eeff'; this.style.borderColor='#6c63ff';"
          onmouseout="this.style.background='#f9f8ff'; this.style.borderColor='#c5bfff';"
        >
          <div id="upload-icon" style="font-size:30px; margin-bottom:8px;">🖼️</div>
          <p id="upload-label" style="margin:0 0 4px; font-size:13px; font-weight:500; color:#6c63ff;">Click to upload image</p>
          <p style="margin:0; font-size:11px; color:#aaa;">JPG, PNG, WEBP — max 5MB</p>
          <input 
            type="file" 
            name="image" 
            id="image-input"
            accept="image/*" 
            style="display:none;"
            onchange="previewImage(this)"
          />
        </label>

        <!-- Image Preview -->
        <div id="preview-box" style="display:none; margin-top:12px; text-align:center; position:relative;">
          <img 
            id="preview-img" 
            src="" 
            style="max-height:150px; max-width:100%; border-radius:10px; border:1.5px solid #e0e0e0; object-fit:contain;" 
          />
          <p id="preview-name" style="margin:6px 0 0; font-size:12px; color:#888;"></p>
          <button 
            type="button" 
            onclick="removeImage()"
            style="margin-top:6px; padding:4px 12px; font-size:12px; color:#e55; background:white; border:1px solid #e55; border-radius:6px; cursor:pointer;"
          >
            Remove
          </button>
        </div>
      </div>

      <!-- Buttons -->
      <div style="display:flex; gap:10px;">
        
        <a 
          href="javascript:history.back()"
          style="flex:1; padding:12px; background:white; color:#666; border:1.5px solid #e0e0e0; border-radius:10px; font-size:14px; font-weight:500; cursor:pointer; text-align:center; text-decoration:none; display:block;"
        >
          Cancel
        </a>

        <button 
          type="submit"
          style="flex:2; padding:12px; background:linear-gradient(135deg,#6c63ff,#48c6ef); color:white; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; letter-spacing:0.3px; transition:opacity .2s;"
          onmouseover="this.style.opacity='0.88'"
          onmouseout="this.style.opacity='1'"
        >
          Save Item
        </button>

      </div>

    </form>
  </div>
</div>

<script>
function previewImage(input) {
  const file = input.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    document.getElementById('preview-img').src = e.target.result;
    document.getElementById('preview-name').textContent = file.name;
    document.getElementById('preview-box').style.display = 'block';
    document.getElementById('upload-label').textContent = '✓ Image selected';
    document.getElementById('upload-icon').textContent = '✅';
  };
  reader.readAsDataURL(file);
}

function removeImage() {
  document.getElementById('image-input').value = '';
  document.getElementById('preview-box').style.display = 'none';
  document.getElementById('upload-label').textContent = 'Click to upload image';
  document.getElementById('upload-icon').textContent = '🖼️';
}
</script>

{% endblock %}
