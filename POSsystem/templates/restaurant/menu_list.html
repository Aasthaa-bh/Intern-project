<!DOCTYPE html>
<html>
<head>
    <title>Menu Items</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <div class="d-flex justify-content-between mb-3">
        <h4>🍽️ Menu Items</h4>
        <a href="{% url 'menu_add' %}" class="btn btn-primary">+ Add Menu Item</a>
    </div>

    <div class="row">
    {% for item in menus %}
    <div class="col-md-3 mb-4">
        <div class="card shadow-sm">

            <!-- antim added - cloudinary image -->
            {% if item.image %}
                <img src="{{ item.image.url }}"
                     class="card-img-top"
                     style="height:200px; object-fit:cover;">
            {% else %}
                <div class="bg-secondary text-white text-center py-5">
                    No Image
                </div>
            {% endif %}

            <div class="card-body">
                <h6>{{ item.name }}</h6>
                <p class="text-success fw-bold">Rs. {{ item.price }}</p>
                <div class="d-flex gap-2">
                    <a href="{% url 'menu_edit' item.pk %}"
                       class="btn btn-sm btn-warning">Edit</a>
                    <a href="{% url 'menu_delete' item.pk %}"
                       class="btn btn-sm btn-danger"
                       onclick="return confirm('Delete this item?')">Delete</a>
                </div>
            </div>
        </div>
    </div>
    {% empty %}
        <p class="text-muted">No menu items yet. Add one!</p>
    {% endfor %}
    </div>

</div>
</body>
</html>
