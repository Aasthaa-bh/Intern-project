<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSewa Payment</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl p-8 max-w-md w-full">
            <div class="text-center mb-6">
                <div class="mx-auto w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mb-4">
                    <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">Pay with eSewa</h1>
                <p class="text-gray-600 mt-2">Secure payment gateway</p>
            </div>

            <div class="bg-gray-50 rounded-lg p-4 mb-6">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-gray-600">Order Amount:</span>
                    <span class="text-lg font-semibold text-gray-900">Rs {{ amount }}</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-600">Transaction ID:</span>
                    <span class="text-sm text-gray-700 font-mono">{{ transaction_uuid|slice:":8" }}...</span>
                </div>
            </div>

            <form action="{{ esewa_data.action }}" method="POST" id="esewaForm">
                {% for key, value in esewa_data.fields.items %}
                    <input type="hidden" name="{{ key }}" value="{{ value }}">
                {% endfor %}
                
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    Proceed to eSewa
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="{% url 'clothing_offer_list' %}" class="text-sm text-gray-600 hover:text-gray-900">
                    ← Back to Offers
                </a>
            </div>

            <div class="mt-6 pt-6 border-t border-gray-200">
                <p class="text-xs text-gray-500 text-center">
                    🔒 Secure payment powered by eSewa
                </p>
            </div>
        </div>
    </div>

    <script>
        // Auto-submit form after 2 seconds (optional)
        // setTimeout(() => {
        //     document.getElementById('esewaForm').submit();
        // }, 2000);
    </script>
</body>
</html>
