<!DOCTYPE html>
<html>
<head>
    <title>FlexiPOS | Smart POS System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #305eb2, #2a5298);
        }

        .container {
            background: white;
            padding: 50px;
            border-radius: 12px;
            text-align: center;
            width: 400px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .container h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #2a5298;
        }

        .container p {
            color: #555;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s ease;
        }

        .login-btn {
            background-color: #2a5298;
            color: white;
        }

        .login-btn:hover {
            background-color: #1e3c72;
        }

        .start-btn {
            background-color: #28a745;
            color: white;
        }

        .start-btn:hover {
            background-color: #1e7e34;
        }

        @media (max-width: 480px) {
            .container {
                width: 90%;
                padding: 30px;
            }

            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FlexiPOS</h1>
        <p>Smart & Customizable Point of Sale System</p>

        <div class="btn-group">
            <a href="{% url 'login' %}" class="btn login-btn">Login</a>
            <a href="{% url 'get_started' %}" class="btn start-btn">Get Started</a>
        </div>
    </div>

</body>
</html>
