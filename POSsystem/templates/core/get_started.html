<!DOCTYPE html>
<html>
<head>
  <title>Get Started</title>
</head>
<body>
  <h2>Business Registration Request</h2>

  {% if messages %}
    <ul>
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Submit Request</button>
  </form>

  <br>
  <a href="{% url 'home' %}">Back to Home</a>
</body>
</html>
