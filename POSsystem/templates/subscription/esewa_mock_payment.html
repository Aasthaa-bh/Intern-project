<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSewa - Sign In</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .main-container {
            display: flex;
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 2px 30px rgba(0,0,0,0.15);
        }
        .left-panel {
            flex: 1;
            background: #f9f9f9;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 1px solid #e0e0e0;
        }
        .merchant-logo {
            width: 60px;
            height: 60px;
            background: #60bb46;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .merchant-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 30px;
        }
        .payment-details {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
        }
        .payment-details h3 {
            font-size: 16px;
            color: #666;
            margin-bottom: 15px;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .detail-row:last-child {
            border-bottom: none;
            padding-top: 15px;
            margin-top: 10px;
            border-top: 2px solid #e0e0e0;
        }
        .detail-label {
            color: #666;
            font-size: 14px;
        }
        .detail-value {
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        .detail-row:last-child .detail-value {
            color: #60bb46;
            font-size: 20px;
        }
        .right-panel {
            flex: 1;
            padding: 40px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background: #60bb46;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
            margin-right: 10px;
        }
        .logo-text {
            font-size: 32px;
            font-weight: 600;
            color: #333;
        }
        .signin-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #60bb46;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-login:hover {
            background: #4fa838;
        }
        .cancel-btn {
            text-align: center;
            margin-top: 20px;
        }
        .cancel-btn button {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 14px;
            text-transform: uppercase;
            padding: 10px 20px;
        }
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .left-panel { border-right: none; border-bottom: 1px solid #e0e0e0; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="left-panel">
            <div class="merchant-logo">e</div>
            <div class="merchant-name">EPAYTEST</div>

            <div class="payment-details">
                <h3>Package Payment</h3>
                <div class="detail-row">
                    <span class="detail-label">Plan</span>
                    <span class="detail-value">{{ subscription.package.name }}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Business</span>
                    <span class="detail-value">{{ subscription.business.business_name }}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">NPR.</span>
                    <span class="detail-value">{{ payment.amount }}</span>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="header">
                <div class="logo">
                    <div class="logo-icon">e</div>
                    <div class="logo-text">Sewa</div>
                </div>
                <h2 class="signin-title">Sign in to your account</h2>
            </div>

            <form method="POST" action="{% url 'sub_esewa_mock_process' subscription.id %}">
                {% csrf_token %}

                <div class="form-group">
                    <label>eSewa ID</label>
                    <input type="text" name="esewa_id" placeholder="eSewa ID" required>
                </div>

                <div class="form-group">
                    <label>Password / MPIN</label>
                    <input type="password" name="mpin" placeholder="Password / MPIN" required>
                </div>

                <button type="submit" class="btn-login">Login</button>
            </form>

            <div class="cancel-btn">
                <form method="POST" action="{% url 'sub_esewa_mock_cancel' subscription.id %}">
                    {% csrf_token %}
                    <button type="submit">Cancel Payment</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
